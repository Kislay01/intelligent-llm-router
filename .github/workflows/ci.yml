name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train classifier (generates model artifacts for tests)
        run: python src/train_classifier.py

      - name: Train v2 router (from committed benchmark data and cached embeddings)
        run: python src/v2_train.py

      - name: Run tests
        run: pytest tests/ -v