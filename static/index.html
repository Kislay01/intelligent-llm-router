<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intelligent LLM Router</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: #0f1117; color: #e6e6e6; height: 100vh; display: flex; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #sidebar { width: 260px; background: #12141c; border-right: 1px solid #2a2d3a; padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
  #sessionList { overflow-y: auto; flex: 1; margin-top: 12px; }
  .session { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .session:hover { background: #1a1d27; }
  .session.active { background: #2b3350; }
  .session .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .session .del { color: #888; background: none; border: none; padding: 0 4px; margin: 0; cursor: pointer; font-size: 14px; }
  .session .del:hover { color: #ff6b6b; }
  #main { flex: 1; padding: 16px 24px; overflow-y: auto; max-width: 960px; }
  textarea { width: 100%; height: 80px; background: #1a1d27; color: #e6e6e6; border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 14px; font-family: inherit; }
  button { background: #4f7cff; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; }
  button:disabled { background: #555; cursor: not-allowed; }
  #newChat { margin: 0; width: 100%; }
  .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .user-msg { background: #2b3350; border-radius: 8px; padding: 10px 14px; margin-top: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .badge { display: inline-block; background: #2b3350; color: #8fb4ff; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-right: 6px; }
  pre { white-space: pre-wrap; word-wrap: break-word; background: #12141c; padding: 12px; border-radius: 6px; font-size: 13px; margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2d3a; font-size: 13px; }
  .tabs { margin-bottom: 8px; }
  .tab { display: inline-block; padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { border-bottom: 2px solid #4f7cff; color: #4f7cff; }
  .hidden { display: none; }
  .empty { color: #777; margin-top: 24px; }
  #dial { margin-top: 12px; font-size: 13px; color: #b8bccb; }
  #dial input[type=range] { width: 100%; margin: 6px 0 2px; }
  #dial .ends { display: flex; justify-content: space-between; font-size: 12px; color: #8a8fa3; }
  #dialHint { font-size: 12px; color: #8a8fa3; margin-top: 4px; min-height: 16px; }
  details.why { margin-top: 10px; font-size: 13px; color: #b8bccb; }
  details.why summary { cursor: pointer; color: #8fb4ff; }
  details.why table { margin-top: 6px; }
  .note { color: #8a8fa3; font-size: 12px; font-style: italic; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Intelligent LLM Router</h1>
  <button id="newChat" onclick="newChat()">+ New chat</button>
  <div id="sessionList"></div>
</div>

<div id="main">
  <div class="tabs">
    <span class="tab active" onclick="showTab('chat', this)">Chat</span>
    <span class="tab" onclick="showTab('dashboard', this)">Dashboard</span>
  </div>

  <div id="chat-tab">
    <div id="thread"><p class="empty">Ask something to start a chat. Past chats are listed on the left.</p></div>
    <div id="dial" class="hidden">
      <label for="dialSlider"><b>Cost / quality</b> (applies to the next message)</label>
      <input type="range" id="dialSlider" min="0" max="100" step="1" value="27" oninput="updateDialHint()">
      <div class="ends"><span>Best quality</span><span>Cheapest</span></div>
      <div id="dialHint"></div>
    </div>
    <textarea id="queryInput" placeholder="Ask something... (Ctrl+Enter to send)"></textarea><br>
    <button id="sendBtn" onclick="sendQuery()">Send</button>
  </div>

  <div id="dashboard-tab" class="hidden">
    <div class="card">
      <h3>Overview</h3>
      <p id="totalRequests"></p>
      <p id="fallbackCount"></p>
    </div>
    <div class="card">
      <h3>Model Usage</h3>
      <table id="usageTable">
        <thead><tr><th>Model</th><th>Requests</th><th>Avg Latency (s)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h3>Recent Requests</h3>
      <table id="recentTable">
        <thead><tr><th>Query</th><th>Model</th><th>Confidence</th><th>Time</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <button onclick="loadStats()">Refresh</button>
  </div>
</div>

<script>
let currentSessionId = null;

// Queries and responses are user/model text: never put them into innerHTML unescaped.
function esc(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

function showTab(tab, el) {
  document.getElementById('chat-tab').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('dashboard-tab').classList.toggle('hidden', tab !== 'dashboard');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'dashboard') loadStats();
}

function appendMessage(m) {
  const thread = document.getElementById('thread');
  const empty = thread.querySelector('.empty');
  if (empty) empty.remove();

  const user = document.createElement('div');
  user.className = 'user-msg';
  user.textContent = m.query;

  const card = document.createElement('div');
  card.className = 'card';
  if (m.routing_query && m.routing_query !== m.query) {
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Routed as: ' + m.routing_query;
    card.appendChild(note);
  }
  const badges = document.createElement('div');
  [
    'Model: ' + m.routed_model,
    'Confidence: ' + (m.confidence * 100).toFixed(1) + '%',
    m.fallback_triggered ? 'Fallback used' : 'Direct routing',
    m.latency_seconds + 's',
  ].forEach(text => {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = text;
    badges.appendChild(b);
  });
  const pre = document.createElement('pre');
  pre.textContent = m.response;
  card.appendChild(badges);
  if (m.explanation && m.all_probabilities) card.appendChild(renderWhy(m));  // above the answer, so a long answer does not bury it
  card.appendChild(pre);

  thread.append(user, card);
  card.scrollIntoView({ block: 'end' });
}

const MODEL_ORDER = ['llama3.2:3b', 'llama3.1:8b', 'qwen2.5-coder:7b', 'mistral:7b'];

// "Why this model?": predicted pass chance per model, and the training queries the prediction came from.
function renderWhy(m) {
  const details = document.createElement('details');
  details.className = 'why';
  const summary = document.createElement('summary');
  summary.textContent = 'Why this model?';
  details.appendChild(summary);

  const intro = document.createElement('div');
  intro.textContent = 'Predicted chance each model answers correctly (from the most similar past queries); the cost slider then trades this against price.';
  details.appendChild(intro);

  const probs = document.createElement('table');
  MODEL_ORDER.forEach(name => {
    if (!(name in m.all_probabilities)) return;
    const tr = document.createElement('tr');
    const chosen = name === m.routed_model ? ' \u2190 chosen' : '';
    tr.innerHTML = `<td>${esc(name)}</td><td>${(m.all_probabilities[name] * 100).toFixed(0)}%</td><td>${esc(chosen)}</td>`;
    probs.appendChild(tr);
  });
  details.appendChild(probs);

  const head = document.createElement('div');
  head.style.marginTop = '8px';
  head.textContent = 'Most similar past queries (\u2713 passed, \u2717 failed):';
  details.appendChild(head);
  m.explanation.forEach(n => {
    const row = document.createElement('div');
    row.style.marginTop = '4px';
    const results = MODEL_ORDER.filter(x => x in n.passed).map(x => x.split(':')[0] + ' ' + (n.passed[x] ? '\u2713' : '\u2717')).join('  ');
    const kind = n.source === 'judged' ? 'judge-graded' : 'unit-tested';
    row.textContent = '\u201c' + n.text.replace(/\s+/g, ' ').slice(0, 110) + '\u201d  (' + (n.similarity * 100).toFixed(0) + '% similar, ' + kind + ')  ' + results;
    details.appendChild(row);
  });
  return details;
}

let dialCurve = null;

async function initDial() {
  try {
    const res = await fetch('/dial-curve');
    dialCurve = await res.json();
  } catch (e) { return; }
  if (dialCurve.router_version !== 'v2') return;
  document.getElementById('dialSlider').value = Math.round(dialCurve.default_cost_weight * 100);
  document.getElementById('dial').classList.remove('hidden');
  updateDialHint();
}

function updateDialHint() {
  const hint = document.getElementById('dialHint');
  const w = document.getElementById('dialSlider').value / 100;
  if (!dialCurve || !dialCurve.points.length) { hint.textContent = ''; return; }
  const p = dialCurve.points.reduce((a, b) => Math.abs(b.cost_weight - w) < Math.abs(a.cost_weight - w) ? b : a);
  hint.textContent = 'Measured out-of-sample on 174 queries near this setting: about ' + p.saved_vs_8b_pct.toFixed(0) +
    '% cheaper than always using llama3.1:8b, judge score ' + p.judge.toFixed(2) + ' vs ' +
    (dialCurve.always_8b_judge == null ? '?' : dialCurve.always_8b_judge.toFixed(2)) + ' for llama3.1:8b alone.';
}

function renderThread(messages) {
  const thread = document.getElementById('thread');
  thread.innerHTML = '';
  if (!messages.length) {
    thread.innerHTML = '<p class="empty">Ask something to start a chat. Past chats are listed on the left.</p>';
    return;
  }
  messages.forEach(appendMessage);
}

async function loadSessions() {
  const res = await fetch('/sessions');
  const sessions = await res.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach(s => {
    const row = document.createElement('div');
    row.className = 'session' + (s.id === currentSessionId ? ' active' : '');
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = s.title;
    title.title = s.title;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = 'Delete chat';
    del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    row.append(title, del);
    row.onclick = () => openSession(s.id);
    list.appendChild(row);
  });
}

async function openSession(id) {
  const res = await fetch('/sessions/' + id);
  if (!res.ok) return;
  const session = await res.json();
  currentSessionId = id;
  renderThread(session.messages);
  loadSessions();
}

async function deleteSession(id) {
  if (!confirm('Delete this chat? The responses and the chat leave the history and usage stats. The text of your queries stays in the training pool used to improve the router (the administrator can switch this off).')) return;
  await fetch('/sessions/' + id, { method: 'DELETE' });
  if (id === currentSessionId) newChat();
  loadSessions();
}

function newChat() {
  currentSessionId = null;
  renderThread([]);
  loadSessions();
}

async function sendQuery() {
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Thinking...';

  try {
    const res = await fetch('/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: currentSessionId, cost_weight: dialCurve && dialCurve.router_version === 'v2' ? document.getElementById('dialSlider').value / 100 : null })
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    currentSessionId = data.session_id;
    appendMessage(data);
    input.value = '';
    loadSessions();
  } catch (e) {
    alert('Error: ' + e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send';
  }
}

initDial();

document.getElementById('queryInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendQuery();
});

async function loadStats() {
  const res = await fetch('/stats');
  const data = await res.json();

  document.getElementById('totalRequests').textContent = 'Total requests: ' + data.total_requests;
  document.getElementById('fallbackCount').textContent = 'Fallback triggered: ' + data.fallback_count;

  const usageBody = document.querySelector('#usageTable tbody');
  usageBody.innerHTML = '';
  data.model_usage.forEach(row => {
    usageBody.innerHTML += `<tr><td>${esc(row.routed_model)}</td><td>${esc(row.count)}</td><td>${row.avg_latency.toFixed(2)}</td></tr>`;
  });

  const recentBody = document.querySelector('#recentTable tbody');
  recentBody.innerHTML = '';
  data.recent_requests.forEach(row => {
    recentBody.innerHTML += `<tr><td>${esc(row.query)}</td><td>${esc(row.routed_model)}</td><td>${(row.confidence*100).toFixed(1)}%</td><td>${esc(row.timestamp)}</td></tr>`;
  });
}

loadSessions();
</script>

</body>
</html>
